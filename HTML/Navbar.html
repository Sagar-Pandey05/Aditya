<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
</head>

<style>
    *{
        margin: 0px;
        padding: 0px;
    }

    body{
        background-color: black;
        height: 1000vh;
    }

    .container{
        height: 20px;
        width: 100vw;
        background-color: bisque;
        display: flex;
        align-items: center;
        justify-content: left;
        position: fixed;
    }

    .list {
        display: flex;
        list-style: none;
        gap: 20px;
    }

</style>

<body>
    <div class="container">
        <ul class="list">
            <a href="https://www.google.com/"><li>Home</li></a>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </div>
</body>
</html>
