<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions in CSS</title>
</head>
<style>
    .container{
        height: 50px;
        width: 300px;
        border: 1px solid red;
        display: flex;
    }

    .one{
        height: 50px;
        width: 50px;
        background-color: yellow;
        
    }

    .two{
        height: 50px;
        width: 50px;
        background-color: purple;
        /* position: relative;
        top: 100px;
        left: 200px; */
        position: absolute;
    }

    .three{
        height: 50px;
        width: 50px;
        background-color: black;
        
    }

    .four{
        height: 50px;
        width: 50px;
        background-color: green;
    }

    

</style>
<body>
    <div class="container">
        <div class="one"></div>
        <div class="two"></div>
        <div class="three"></div>
        <div class="four"></div>
    </div>

</body>
</html>
